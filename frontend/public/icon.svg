<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base circle background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Wallet/Money icon -->
  <g transform="translate(100, 140)">
    <!-- Wallet body -->
    <rect x="0" y="40" width="220" height="140" rx="16" fill="url(#accentGradient)" opacity="0.3" stroke="url(#accentGradient)" stroke-width="3"/>
    
    <!-- Card in wallet -->
    <rect x="15" y="50" width="100" height="60" rx="8" fill="url(#accentGradient)" opacity="0.6" stroke="url(#accentGradient)" stroke-width="2"/>
    
    <!-- Coin stacks -->
    <circle cx="150" cy="70" r="12" fill="url(#accentGradient)"/>
    <circle cx="150" cy="88" r="12" fill="url(#accentGradient)" opacity="0.7"/>
    <circle cx="170" cy="78" r="12" fill="url(#accentGradient)"/>
    <circle cx="170" cy="96" r="12" fill="url(#accentGradient)" opacity="0.7"/>
  </g>
  
  <!-- Apple/Nutrition icon (upper right) -->
  <g transform="translate(260, 100)">
    <!-- Apple shape -->
    <circle cx="40" cy="50" r="35" fill="#FF6B6B" opacity="0.8"/>
    <circle cx="55" cy="40" r="20" fill="#FF6B6B"/>
    <path d="M 40 15 Q 35 5 40 0 Q 45 5 40 15" fill="#4CAF50"/>
    
    <!-- Leaf -->
    <ellipse cx="45" cy="8" rx="8" ry="12" fill="#4CAF50" transform="rotate(30 45 8)"/>
  </g>
  
  <!-- Chart lines (lower right) -->
  <g transform="translate(260, 280)">
    <line x1="0" y1="50" x2="80" y2="20" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="50" r="4" fill="url(#accentGradient)"/>
    <circle cx="40" cy="35" r="4" fill="url(#accentGradient)"/>
    <circle cx="80" cy="20" r="4" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Text "F" for FinTrack (optional branding) -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#accentGradient)" text-anchor="middle" opacity="0.9">F</text>
</svg>
