spring:
  application:
    name: fintrack-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/fintrack}

server:
  port: ${SERVER_PORT:8081}

app:
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:8080}
  storage-quota-bytes: ${APP_STORAGE_QUOTA_BYTES:536870912}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
